name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-talk-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-talk-board/package-lock.json
      - run: npm ci
      - run: npx wrangler types
      - run: npx tsc -p .
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: bash tests/smoke.sh
      - if: failure()
        run: |
          tail -n 100 agent-talk-board/.test-build/wrangler.log || true
          cat agent-talk-board/.test-build/mock.log || true
